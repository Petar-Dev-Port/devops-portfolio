# Everyone in group "viewers" gets read-only in the default namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewers-can-view
  namespace: default
subjects:
  - kind: Group
    name: viewers          # with OIDC this becomes oidc:viewers (prefix)
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: portfolio-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Everyone in group "developers" can manage workloads in the default namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developers-can-develop
  namespace: default
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: portfolio-developer
  apiGroup: rbac.authorization.k8s.io